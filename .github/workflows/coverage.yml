name: coverage

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    rust-coverage:
        runs-on: ubuntu-latest
        env:
            # Use the workspace release profile unchanged for both test stages.
            RUST_MIN_STACK: "8388608"
            PARITY_CACHE_SCHEMA: v1
            PARITY_DATA: target/parity-tests-ci
            CARGO_TARGET_DIR: target/rust-build
            CARGO_LLVM_COV_TARGET_DIR: target/coverage-build
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: llvm-tools-preview
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: unified-release-coverage-v2
                  key: ${{ hashFiles('crates/**/*.rs', 'parity-tests/**/*.rs') }}
                  workspaces: |
                      . -> target/rust-build
                      . -> target/coverage-build
                  cache-workspace-crates: true
                  cache-on-failure: true
            - uses: taiki-e/install-action@cargo-llvm-cov

            - name: Select current Rust libraries and runner regressions
              shell: bash
              run: |
                  cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/workspace.json"
                  jq -r '. as $workspace | .packages[] |
                      select(.id as $id | $workspace.workspace_members | index($id)) |
                      select(.publish != [] or .name == "cosmolkit-parity-tests") |
                      .name' "$RUNNER_TEMP/workspace.json" > "$RUNNER_TEMP/test-packages.txt"
                  test -s "$RUNNER_TEMP/test-packages.txt"
                  cat "$RUNNER_TEMP/test-packages.txt"

            - name: Run all default crate regression suites with coverage
              id: regression
              continue-on-error: true
              shell: bash
              run: |
                  packages=()
                  while IFS= read -r package; do packages+=(-p "$package"); done < "$RUNNER_TEMP/test-packages.txt"
                  # Reset measurements without discarding cached compilation.
                  cargo llvm-cov clean --workspace --profraw-only
                  cargo llvm-cov "${packages[@]}" --release \
                      --features cosmolkit/op-contracts-strict,cosmolkit-core/op-contracts-strict \
                      --no-report --no-fail-fast

            - name: Run documentation tests
              id: doctests
              if: ${{ !cancelled() && steps.regression.outcome != 'skipped' }}
              continue-on-error: true
              shell: bash
              run: |
                  packages=()
                  while IFS= read -r package; do packages+=(-p "$package"); done < "$RUNNER_TEMP/test-packages.txt"
                  cargo test "${packages[@]}" --release --doc --no-fail-fast \
                      --features cosmolkit/op-contracts-strict,cosmolkit-core/op-contracts-strict

            - uses: actions/setup-python@v5
              id: python
              with:
                  python-version: "3.13.12"
            - uses: astral-sh/setup-uv@v6
            - name: Install pinned reference environment
              run: uv sync --locked --group dev

            # Exact identity prefix only: never restore another corpus/environment.
            # A unique suffix lets a repaired generation replace a corrupt cache.
            - name: Restore reference generations
              id: reference_cache
              uses: actions/cache/restore@v4
              with:
                  path: |
                      ${{ env.PARITY_DATA }}/*/input.json
                      ${{ env.PARITY_DATA }}/*/reference.json
                      ${{ env.PARITY_DATA }}/*/manifest.json
                  key: parity-${{ env.PARITY_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'parity-tests/Cargo.toml', 'parity-tests/src/**', 'tools/oracles/rdkit/fingerprint_values_pilot.py', 'testdata/smiles/corpus/smiles_5000.smi') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      parity-${{ env.PARITY_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'parity-tests/Cargo.toml', 'parity-tests/src/**', 'tools/oracles/rdkit/fingerprint_values_pilot.py', 'testdata/smiles/corpus/smiles_5000.smi') }}-

            - name: Run every registered task on the 5000 molecular corpus
              id: parity
              continue-on-error: true
              shell: bash
              run: |
                  # No --task filter: Rust owns all task and parameter selection.
                  # Fuzzy tasks use the Rust-defined 5000-pair matrix (20000 comparisons).
                  # run prepares/reuses references and globally preflights before CK.
                  set +e
                  cargo llvm-cov run -p cosmolkit-parity-tests --release --no-report \
                      --features cosmolkit/op-contracts-strict \
                      -- run --corpus testdata/smiles/corpus/smiles_5000.smi \
                      --data "$PARITY_DATA" --python .venv/bin/python \
                      2>&1 | tee "$RUNNER_TEMP/parity-5000.log"
                  statuses=("${PIPESTATUS[@]}")
                  status=${statuses[0]}
                  if [[ ${statuses[1]} != 0 ]]; then status=${statuses[1]}; fi
                  set -e
                  # This message is emitted only after successful global preflight.
                  if grep -Eq '^Preparation complete: [0-9]+ reused tasks, [1-9][0-9]* generated tasks; [0-9]+ ready cases$' "$RUNNER_TEMP/parity-5000.log"; then
                      echo "regenerated=true" >> "$GITHUB_OUTPUT"
                  fi
                  exit "$status"

            - name: Save validated reference generations
              if: ${{ !cancelled() && steps.parity.outputs.regenerated == 'true' }}
              uses: actions/cache/save@v4
              with:
                  path: |
                      ${{ env.PARITY_DATA }}/*/input.json
                      ${{ env.PARITY_DATA }}/*/reference.json
                      ${{ env.PARITY_DATA }}/*/manifest.json
                  key: ${{ steps.reference_cache.outputs.cache-primary-key }}

            - name: Upload parity results
              if: ${{ !cancelled() && steps.parity.outcome != 'skipped' }}
              uses: actions/upload-artifact@v4
              with:
                  name: parity-5000-results
                  path: |
                      ${{ runner.temp }}/parity-5000.log
                      ${{ env.PARITY_DATA }}/rust-report.json
                  if-no-files-found: error

            - name: Generate coverage reports
              if: ${{ !cancelled() && steps.regression.outcome != 'skipped' }}
              shell: bash
              run: |
                  packages=()
                  while IFS= read -r package; do packages+=(-p "$package"); done < "$RUNNER_TEMP/test-packages.txt"
                  for format in html lcov; do
                      report_log="$(mktemp)"
                      output=(--html --output-dir target/llvm-cov/html)
                      if [[ "$format" == lcov ]]; then output=(--lcov --output-path lcov.info); fi
                      if ! cargo llvm-cov report "${packages[@]}" --release "${output[@]}" 2>"$report_log"; then
                          cat "$report_log" >&2
                          exit 1
                      fi
                      cat "$report_log" >&2
                      if grep -Eq '[0-9]+ functions have mismatched data' "$report_log"; then
                          echo "Coverage profiles do not match the instrumented objects." >&2
                          exit 1
                      fi
                  done

            - name: Upload HTML coverage
              if: ${{ !cancelled() && steps.regression.outcome != 'skipped' }}
              uses: actions/upload-artifact@v4
              with:
                  name: llvm-cov-html
                  path: target/llvm-cov/html
                  if-no-files-found: error

            - name: Upload coverage to Codecov
              if: ${{ !cancelled() && steps.regression.outcome != 'skipped' }}
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: lcov.info
                  flags: rust
                  name: rust-regressions-and-parity
                  fail_ci_if_error: false

            - name: Remove raw coverage measurements before caching builds
              if: ${{ always() }}
              run: cargo llvm-cov clean --workspace --profraw-only

            - name: Preserve test failure status
              if: ${{ !cancelled() && (steps.regression.outcome == 'failure' || steps.doctests.outcome == 'failure' || steps.parity.outcome == 'failure') }}
              run: exit 1
