[package]
name = "cosmolkit-io"
description = "SDF, PDB, XYZ, and related detached molecular IO"
keywords = ["cheminformatics", "sdf", "pdb", "xyz", "io"]
categories = ["parser-implementations", "science"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[features]
default = []
bio = ["dep:cosmolkit-bio"]

[dependencies]
cosmolkit-bio = { version = "0.5.0-rc.8", path = "../cosmolkit-bio", optional = true }
cosmolkit-core = { version = "0.5.0-rc.8", path = "../cosmolkit-core" }
cosmolkit-model = { version = "0.5.0-rc.8", path = "../cosmolkit-model" }
cosmolkit-search = { version = "0.5.0-rc.8", path = "../cosmolkit-search" }
cosmolkit-types = { version = "0.5.0-rc.8", path = "../cosmolkit-types" }
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "migration_io_cif"
required-features = ["bio"]

[[test]]
name = "migration_io_bio_pdb"
required-features = ["bio"]

[[test]]
name = "migration_io_bio_mmcif"
required-features = ["bio"]

[[test]]
name = "migration_io_mmjson"
required-features = ["bio"]

[[test]]
name = "migration_io_bio_chemcomp"
required-features = ["bio"]

[[test]]
name = "migration_io_bio_read"
required-features = ["bio"]
